name: outbox-sweep
# Serverless host (spec 10.3, 10.7): retries queued mail about every 5 minutes. GitHub may delay
# scheduled runs under load, so mail is also sent once right after it is queued.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: outbox-sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the drain endpoint
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "sweep not configured"; exit 0; fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$API_BASE_URL/internal/outbox/drain")
          echo "status $code"; cat /tmp/out.json; echo
          [ "$code" = "200" ]
